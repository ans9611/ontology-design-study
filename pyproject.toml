[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontostudy"
version = "0.1.0"
description = "Ontology design choices vs. query cost: literature, cases, experiment"
requires-python = ">=3.9"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas",
    "pagerank-empirical @ git+https://github.com/ans9611/PageRank_Empirical_Analysis",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
